<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Panini · FIFA World Cup 2026™</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #080a10;
  --bg2:      #0d1018;
  --surface:  rgba(255,255,255,0.04);
  --surface2: rgba(255,255,255,0.07);
  --border:   rgba(255,255,255,0.08);
  --border2:  rgba(255,255,255,0.14);
  --red:      #ff3b2f;
  --red-dim:  rgba(255,59,47,0.15);
  --gold:     #f5a623;
  --gold-dim: rgba(245,166,35,0.15);
  --green:    #30d158;
  --green-dim:rgba(48,209,88,0.15);
  --blue:     #0a84ff;
  --text:     #f5f5f7;
  --text2:    #86868b;
  --text3:    #3a3a3c;
  --ff:       'Inter', sans-serif;
  --mono:     'JetBrains Mono', monospace;
  --r:        14px;
  --r2:       10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;}
body{
  font-family:var(--ff);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ═══════════════════ HEADER ═══════════════════ */
.hdr{
  position:sticky;top:0;z-index:100;
  background:rgba(8,10,16,0.85);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);
  padding:0 20px;
  padding-top:env(safe-area-inset-top);
}
.hdr-inner{
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;gap:16px;height:60px;
}
.logo{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  text-decoration:none;
}
.logo-mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--red),#ff6b35);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#fff;letter-spacing:-0.5px;
  font-family:var(--ff);flex-shrink:0;
}
.logo-text{
  display:flex;flex-direction:column;gap:1px;
}
.logo-name{
  font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.3px;line-height:1;
}
.logo-year{
  font-size:10px;font-weight:500;color:var(--text2);letter-spacing:1px;text-transform:uppercase;
}

/* arc progress in header */
.hdr-progress{
  flex:1;display:flex;align-items:center;justify-content:center;gap:10px;
}
.arc-svg{width:44px;height:44px;flex-shrink:0;}
.arc-track{fill:none;stroke:var(--border2);stroke-width:4;}
.arc-fill{
  fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:113;stroke-dashoffset:113;
  transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1);
}
.arc-info{display:flex;flex-direction:column;gap:1px;}
.arc-pct{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-1px;line-height:1;}
.arc-sub{font-family:var(--mono);font-size:10px;color:var(--text2);}

.hdr-nav{display:flex;align-items:center;gap:6px;}
.hdr-btn{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.5px;
  text-transform:uppercase;padding:7px 12px;border-radius:8px;border:1px solid var(--border2);
  background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;
  white-space:nowrap;
}
.hdr-btn:hover{border-color:var(--border2);background:var(--surface2);color:var(--text);}
.hdr-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
.hdr-btn.ghost{border-color:transparent;background:transparent;}
.hdr-btn.ghost:hover{background:var(--surface);border-color:var(--border);}

/* ═══════════════════ TAB BAR ═══════════════════ */
.tabbar{
  display:flex;gap:0;
  border-bottom:1px solid var(--border);
  padding:0 20px;
  max-width:1100px;margin:0 auto;
  overflow-x:auto;
}
.tabbar::-webkit-scrollbar{display:none;}
.tab{
  font-size:13px;font-weight:600;
  padding:14px 18px;border:none;background:transparent;
  color:var(--text2);cursor:pointer;transition:all .15s;
  border-bottom:2px solid transparent;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--red);}
.tab-badge{
  background:var(--red);color:#fff;font-size:9px;font-weight:700;
  font-family:var(--mono);padding:2px 6px;border-radius:20px;
  min-width:18px;text-align:center;
}

/* ═══════════════════ STATS STRIP ═══════════════════ */
.stats-strip{
  max-width:1100px;margin:20px auto 0;padding:0 20px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
}
.stat{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;
  display:flex;flex-direction:column;gap:4px;
  transition:background .15s;
}
.stat:hover{background:var(--surface2);}
.stat-lbl{font-size:11px;font-weight:500;color:var(--text2);letter-spacing:0.3px;}
.stat-val{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1;}
.stat-val.red{color:var(--red);}
.stat-val.green{color:var(--green);}
.stat-val.gold{color:var(--gold);}
.stat-val.dim{color:var(--text3);}

/* ═══════════════════ TOOLBAR ═══════════════════ */
.toolbar{
  max-width:1100px;margin:16px auto 0;padding:0 20px;
  display:flex;gap:8px;align-items:center;
  overflow-x:auto;
}
.toolbar::-webkit-scrollbar{display:none;}
.search-wrap{flex:1;min-width:160px;position:relative;}
.search-ico{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--text2);font-size:14px;pointer-events:none;
}
.search-in{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px 10px 36px;
  font-family:var(--ff);font-size:16px;color:var(--text);outline:none;
  transition:border-color .15s,background .15s;
  padding-right:36px;
}
.search-in:focus{border-color:var(--border2);background:var(--surface2);}
.search-in::placeholder{color:var(--text2);}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:50%;
  background:var(--border2);border:none;
  color:var(--text2);font-size:11px;font-weight:700;
  cursor:pointer;display:none;
  align-items:center;justify-content:center;
  transition:all .15s;line-height:1;
}
.search-clear:hover{background:var(--red);color:#fff;}
.search-clear.visible{display:flex;}

.chip{
  font-size:12px;font-weight:600;padding:9px 14px;border-radius:20px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.chip:hover{border-color:var(--border2);color:var(--text);}
.chip.active{background:var(--red);border-color:var(--red);color:#fff;}
.chip.warn:hover{border-color:var(--red);color:var(--red);}
.chip.exp{border-color:var(--gold-dim);}
.chip.exp:hover{border-color:var(--gold);color:var(--gold);}

/* ═══════════════════ MAIN PAGE ═══════════════════ */
.page{max-width:1100px;margin:28px auto 60px;padding:0 20px;}

/* GROUP HEADING */
.grp-hd{
  display:flex;align-items:center;gap:12px;
  margin-bottom:12px;
}
.grp-letter{
  font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--red);border:1px solid var(--red-dim);background:var(--red-dim);
  border-radius:6px;padding:3px 8px;flex-shrink:0;
}
.grp-name{font-size:13px;font-weight:600;color:var(--text2);}
.grp-bar-out{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.grp-bar-in{height:100%;background:var(--red);border-radius:2px;transition:width .5s;}
.grp-tally{font-family:var(--mono);font-size:11px;color:var(--text2);white-space:nowrap;}

/* TEAM GRID */
.tgrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:10px;margin-bottom:32px;
}

/* TEAM CARD */
.tcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
  transition:border-color .2s,background .2s;
  position:relative;
}
.tcard:hover{background:var(--surface2);border-color:var(--border2);}
.tcard.done{border-color:rgba(48,209,88,0.3);}
.tcard.done .thead{background:rgba(48,209,88,0.06);}

/* done ribbon */
.tcard.done::after{
  content:'✓';
  position:absolute;top:10px;right:10px;
  width:20px;height:20px;border-radius:50%;
  background:var(--green);color:#fff;
  font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  z-index:5;
}

.thead{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px 10px;
  border-bottom:1px solid var(--border);
  transition:background .2s;
}
.tflag{font-size:26px;line-height:1;flex-shrink:0;}
.tinfo{flex:1;min-width:0;}
.tname{
  font-size:13px;font-weight:700;letter-spacing:0.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tcode{font-family:var(--mono);font-size:9px;color:var(--text2);letter-spacing:2px;margin-top:2px;}
.tcnt{font-family:var(--mono);font-size:11px;color:var(--text2);flex-shrink:0;}
.tcnt b{font-size:16px;font-weight:700;color:var(--text);}

/* sticker grid */
.tstks{
  padding:10px 12px 6px;
  display:grid;grid-template-columns:repeat(10,1fr);gap:3px;
}
.stk{
  aspect-ratio:1;border-radius:4px;border:1px solid var(--border);
  background:var(--bg2);cursor:pointer;
  transition:transform .1s,border-color .1s,background .1s;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:7px;color:var(--text3);
  position:relative;overflow:hidden;user-select:none;
}
.stk:hover{border-color:var(--border2);transform:scale(1.15);z-index:5;background:var(--surface2);}
.stk.got{
  background:var(--green-dim);border-color:rgba(48,209,88,0.4);color:rgba(48,209,88,0.8);
}
.stk.foil{
  border-color:rgba(245,166,35,0.4);
  background:linear-gradient(135deg,rgba(245,166,35,0.08),rgba(245,166,35,0.18),rgba(245,166,35,0.08));
  color:rgba(245,166,35,0.6);
}
.stk.foil.got{
  background:linear-gradient(135deg,rgba(245,166,35,0.2),rgba(245,166,35,0.4),rgba(245,166,35,0.2));
  border-color:rgba(245,166,35,0.7);color:var(--gold);
}
/* tooltip */
.stk::before{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);font-family:var(--mono);font-size:9px;font-weight:700;
  padding:4px 8px;border-radius:6px;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .1s;z-index:60;
}
.stk:hover::before{opacity:1;}

/* progress bar + actions */
.tbar{margin:4px 12px 0;height:2px;background:var(--border);border-radius:1px;overflow:hidden;}
.tbar-f{height:100%;background:var(--green);border-radius:1px;transition:width .3s;}
.tcard.done .tbar-f{background:var(--green);}
.tfoot{
  display:flex;border-top:1px solid var(--border);margin-top:8px;
}
.tfbtn{
  flex:1;padding:8px 0;font-size:10px;font-weight:600;letter-spacing:0.3px;
  background:transparent;border:none;cursor:pointer;color:var(--text2);transition:all .15s;
}
.tfbtn:hover{background:var(--surface2);color:var(--green);}
.tfbtn.clr:hover{color:var(--red);}
.tfbtn+.tfbtn{border-left:1px solid var(--border);}

/* animations */
@keyframes stk-pop-in{
  0%{transform:scale(1);}
  30%{transform:scale(1.4) rotate(-5deg);}
  60%{transform:scale(0.9) rotate(2deg);}
  80%{transform:scale(1.1) rotate(-1deg);}
  100%{transform:scale(1) rotate(0);}
}
@keyframes stk-pop-out{
  0%{transform:scale(1);}
  30%{transform:scale(0.7) rotate(4deg);}
  70%{transform:scale(1.05) rotate(-1deg);}
  100%{transform:scale(1) rotate(0);}
}
@keyframes ripple{
  0%{transform:translate(-50%,-50%) scale(0);opacity:.6;}
  100%{transform:translate(-50%,-50%) scale(4);opacity:0;}
}
.stk.pop-in{animation:stk-pop-in .35s cubic-bezier(.4,0,.2,1) forwards;}
.stk.pop-out{animation:stk-pop-out .3s cubic-bezier(.4,0,.2,1) forwards;}
.stk-rip{
  position:absolute;width:50%;padding-top:50%;border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  animation:ripple .4s ease-out forwards;pointer-events:none;z-index:20;
  background:rgba(48,209,88,0.4);
}
.stk.foil .stk-rip{background:rgba(245,166,35,0.5);}

/* ═══════════════════ INTRO CARD ═══════════════════ */
.intro-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;margin-bottom:32px;
}
.intro-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);
}
.intro-title{font-size:13px;font-weight:700;color:var(--text);}
.intro-badge{
  font-family:var(--mono);font-size:10px;color:var(--text2);
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:3px 10px;
}
.intro-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
.intro-sub{font-size:10px;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.intro-row{display:flex;flex-wrap:wrap;gap:4px;}

/* dark sticker for intro */
.dstk{
  width:36px;height:36px;border-radius:5px;
  border:1px solid var(--border);background:var(--bg2);
  cursor:pointer;transition:transform .1s,border-color .1s,background .1s;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:7px;color:var(--text3);
  position:relative;overflow:hidden;user-select:none;
}
.dstk:hover{border-color:var(--border2);transform:scale(1.12);z-index:5;}
.dstk.foil{
  border-color:rgba(245,166,35,0.35);
  background:linear-gradient(135deg,rgba(245,166,35,0.06),rgba(245,166,35,0.14));
  color:rgba(245,166,35,0.5);
}
.dstk.foil.got{
  background:linear-gradient(135deg,rgba(245,166,35,0.2),rgba(245,166,35,0.4));
  border-color:rgba(245,166,35,0.7);color:var(--gold);
}
.dstk.got{background:var(--green-dim);border-color:rgba(48,209,88,0.4);color:rgba(48,209,88,0.8);}
.dstk::after{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);font-family:var(--mono);font-size:9px;font-weight:700;
  padding:4px 8px;border-radius:6px;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .1s;z-index:60;
}
.dstk:hover::after{opacity:1;}
.dstk.pop-in{animation:stk-pop-in .35s cubic-bezier(.4,0,.2,1) forwards;}
.dstk.pop-out{animation:stk-pop-out .3s cubic-bezier(.4,0,.2,1) forwards;}

/* ═══════════════════ COCA-COLA CARD ═══════════════════ */
.coke-card{
  background:var(--surface);border:1px solid rgba(255,59,47,0.25);
  border-radius:var(--r);overflow:hidden;margin-bottom:32px;
}
.coke-hd{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-bottom:1px solid rgba(255,59,47,0.15);
  background:rgba(255,59,47,0.06);
}
.coke-brand{display:flex;align-items:center;gap:10px;}
.coke-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--red),#ff6b35);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.coke-title{font-size:13px;font-weight:700;}
.coke-sub{font-size:10px;color:var(--text2);margin-top:2px;}
.coke-tally{
  font-family:var(--mono);font-size:10px;color:var(--text2);
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:3px 10px;white-space:nowrap;
}
.coke-pbar{height:2px;background:var(--border);overflow:hidden;}
.coke-pbar-f{height:100%;background:var(--red);transition:width .4s;}
.coke-body{
  padding:14px 16px 16px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;
}
.cstk{
  border:1px solid var(--border);border-radius:10px;background:var(--bg2);
  padding:10px 12px;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:8px;overflow:hidden;position:relative;
  user-select:none;
}
.cstk:hover{border-color:rgba(255,59,47,0.4);background:var(--surface);}
.cstk.got{background:var(--red-dim);border-color:rgba(255,59,47,0.5);}
.cstk-num{font-family:var(--mono);font-size:9px;color:var(--text2);flex-shrink:0;}
.cstk-flag{font-size:18px;flex-shrink:0;}
.cstk-info{min-width:0;}
.cstk-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cstk-country{font-size:9px;color:var(--text2);}
.cstk.got .cstk-num{color:rgba(255,59,47,0.7);}
.cstk.got .cstk-name{color:var(--red);}
.coke-note{
  padding:0 16px 14px;font-size:10px;color:var(--text2);
  display:flex;align-items:flex-start;gap:6px;
  border-top:1px solid var(--border);padding-top:10px;margin:0 16px 14px;
}
@keyframes cstk-pop{
  0%{transform:scale(1);}25%{transform:scale(1.06);}60%{transform:scale(0.97);}100%{transform:scale(1);}
}
.cstk.pop{animation:cstk-pop .3s ease forwards;}
.crip{
  position:absolute;width:100%;padding-top:100%;border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  animation:ripple .4s ease-out forwards;pointer-events:none;z-index:10;
  background:rgba(255,59,47,0.25);
}

/* ═══════════════════ DUPLICATES TAB ═══════════════════ */
.dup-page{max-width:1100px;margin:0 auto;padding:20px 20px 60px;}
.dup-toolbar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin-bottom:16px;
}
.dup-search-wrap{flex:1;min-width:160px;position:relative;}
.dup-search{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 36px 10px 14px;font-family:var(--ff);font-size:16px;
  color:var(--text);outline:none;transition:border-color .15s;
}
.dup-search:focus{border-color:var(--border2);}
.dup-search::placeholder{color:var(--text2);}
.dup-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:50%;
  background:var(--border2);border:none;
  color:var(--text2);font-size:11px;font-weight:700;
  cursor:pointer;display:none;
  align-items:center;justify-content:center;
  transition:all .15s;line-height:1;
}
.dup-clear:hover{background:var(--red);color:#fff;}
.dup-clear.visible{display:flex;}
.dup-chip{
  font-size:11px;font-weight:600;padding:9px 14px;border-radius:20px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.dup-chip:hover{border-color:var(--border2);color:var(--text);}
.dup-chip.on{background:rgba(245,166,35,0.15);border-color:rgba(245,166,35,0.4);color:var(--gold);}

.dup-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.dup-stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;display:flex;flex-direction:column;gap:3px;
}
.dup-stat-lbl{font-size:10px;font-weight:500;color:var(--text2);}
.dup-stat-val{font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1;}
.dup-stat-val.red{color:var(--red);} .dup-stat-val.gold{color:var(--gold);} .dup-stat-val.green{color:var(--green);}

.dup-group{margin-bottom:24px;}
.dup-group-title{
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--text2);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.dup-team{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  overflow:hidden;margin-bottom:6px;transition:border-color .15s;
}
.dup-team:hover{border-color:var(--border2);}
.dup-team-hd{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  cursor:pointer;user-select:none;
}
.dup-team-flag{font-size:20px;flex-shrink:0;}
.dup-team-name{font-size:13px;font-weight:600;flex:1;}
.dup-badge{
  font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:20px;
  border:1px solid var(--border);color:var(--text2);background:var(--bg2);
}
.dup-badge.has{background:var(--red-dim);border-color:rgba(255,59,47,0.4);color:var(--red);}
.dup-chev{font-size:10px;color:var(--text2);transition:transform .2s;margin-left:4px;}
.dup-team.open .dup-chev{transform:rotate(180deg);}
.dup-stickers{display:none;flex-wrap:wrap;gap:5px;padding:4px 14px 14px;}
.dup-team.open .dup-stickers{display:flex;}
.dup-stk{
  display:flex;align-items:center;
  border:1px solid var(--border);border-radius:8px;overflow:hidden;
  background:var(--bg2);transition:border-color .15s;
}
.dup-stk.has{border-color:rgba(255,59,47,0.35);}
.dup-stk.foil{border-color:rgba(245,166,35,0.35);}
.dup-stk-num{
  font-family:var(--mono);font-size:9px;color:var(--text2);
  padding:5px 8px;border-right:1px solid var(--border);
  background:var(--surface);min-width:30px;text-align:center;
}
.dup-stk.foil .dup-stk-num{background:rgba(245,166,35,0.08);color:rgba(245,166,35,0.7);}
.dup-stk.has .dup-stk-num{color:var(--text);}
.dbtn{
  width:26px;height:30px;border:none;background:transparent;
  cursor:pointer;color:var(--text2);transition:all .1s;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.dbtn:hover{background:var(--surface2);}
.dbtn.plus:hover{color:var(--green);}
.dbtn.minus:hover{color:var(--red);}
.dcount{
  font-family:var(--mono);font-size:12px;font-weight:700;
  min-width:22px;text-align:center;color:var(--text);
}
.dcount.zero{color:var(--text3);}
.dup-empty{
  text-align:center;padding:60px 20px;font-size:12px;font-weight:500;
  color:var(--text2);letter-spacing:0.5px;
}

/* ═══════════════════ EXPORT MODAL ═══════════════════ */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:500;display:none;align-items:flex-end;justify-content:center;
  padding:0;
}
.overlay.open{display:flex;}
@media(min-width:600px){
  .overlay{align-items:center;padding:20px;}
}
.modal{
  background:#111318;border:1px solid var(--border2);
  border-radius:20px 20px 0 0;width:100%;height:94vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -20px 60px rgba(0,0,0,0.6);
}
@media(min-width:600px){
  .modal{border-radius:20px;max-width:520px;height:88vh;}
}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-handle{
  width:36px;height:4px;background:var(--border2);border-radius:2px;
  margin:12px auto 0;flex-shrink:0;
  display:block;
}
@media(min-width:600px){.modal-handle{display:none;}}
.modal-title{font-size:16px;font-weight:700;}
.modal-x{
  width:28px;height:28px;border-radius:50%;background:var(--surface2);border:none;
  color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:all .15s;
}
.modal-x:hover{background:var(--surface);color:var(--text);}
.modal-tabs{
  display:flex;border-bottom:1px solid var(--border);flex-shrink:0;
}
.mtab{
  flex:1;font-size:13px;font-weight:600;padding:12px;border:none;
  background:transparent;color:var(--text2);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;
}
.mtab:hover{color:var(--text);}
.mtab.active{color:var(--text);border-bottom-color:var(--red);}
.modal-body{flex:1;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-height:0;}
.exp-ta{
  width:100%;
  background:var(--bg);color:var(--green);
  font-family:var(--mono);font-size:16px;line-height:1.7;
  padding:14px;border:1px solid var(--border);border-radius:10px;resize:none;outline:none;
  flex:1;min-height:0;height:0;
}
.exp-hint{font-size:11px;color:var(--text2);}
.modal-ft{
  padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0;
}
.copy-btn{
  width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--red);color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .15s;
}
.copy-btn:hover{background:#ff5147;}
.copy-btn.ok{background:var(--green);color:#fff;}

/* ═══════════════════ STICKER LOOKUP ═══════════════════ */
.lookup-result {
  max-width:1100px;margin:10px auto 0;padding:0 20px;
  display:none;
}
.lookup-pill {
  display:inline-flex;align-items:center;gap:10px;
  padding:10px 16px;border-radius:12px;border:1px solid var(--border2);
  background:var(--surface2);font-size:13px;font-weight:500;
  animation:lookup-in .2s ease;
}
@keyframes lookup-in {
  from{opacity:0;transform:translateY(-6px);}
  to{opacity:1;transform:translateY(0);}
}
.lookup-pill.found   { border-color:rgba(48,209,88,0.4);  background:rgba(48,209,88,0.1);  }
.lookup-pill.missing { border-color:rgba(255,59,47,0.4);  background:rgba(255,59,47,0.1);  }
.lookup-dot {
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.lookup-pill.found   .lookup-dot { background:var(--green); }
.lookup-pill.missing .lookup-dot { background:var(--red);   }
.lookup-code  { font-family:var(--mono);font-weight:700;color:var(--text); }
.lookup-label { display:none; }
.lookup-status{ font-weight:700; }
.lookup-pill.found   .lookup-status { color:var(--green); }
.lookup-pill.missing .lookup-status { color:var(--red);   }
.lookup-toggle {
  margin-left:4px;padding:4px 10px;border-radius:8px;border:none;
  font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;
}
.lookup-pill.found   .lookup-toggle { background:rgba(255,59,47,0.2); color:var(--red); }
.lookup-pill.found   .lookup-toggle:hover { background:rgba(255,59,47,0.35); }
.lookup-pill.missing .lookup-toggle { background:rgba(48,209,88,0.2); color:var(--green); }
.lookup-pill.missing .lookup-toggle:hover { background:rgba(48,209,88,0.35); }
.lookup-dup {
  display:flex;align-items:center;gap:8px;
  margin-top:8px;padding:8px 12px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);
  font-size:12px;
}
.lookup-dup-label { color:var(--text2); }
.lookup-dup-count { font-family:var(--mono);font-weight:700;color:var(--gold);min-width:16px;text-align:center; }
.lookup-dup-count.zero { color:var(--text3); }
.lookup-dup-btns { display:flex;gap:4px;margin-left:auto; }
.lookup-dup-btn {
  width:26px;height:26px;border-radius:7px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text2);font-size:15px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .12s;font-weight:700;
}
.lookup-dup-btn:hover { background:var(--surface);border-color:var(--border2); }
.lookup-dup-btn.plus:hover  { color:var(--gold);border-color:rgba(245,166,35,0.5); }
.lookup-dup-btn.minus:hover { color:var(--red);border-color:rgba(255,59,47,0.5); }

/* ═══════════════════ BACKUP MODAL ═══════════════════ */
.backup-tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
.backup-tab {
  flex:1; font-size:13px; font-weight:600; padding:12px; border:none;
  background:transparent; color:var(--text2); cursor:pointer;
  border-bottom:2px solid transparent; transition:all .15s;
}
.backup-tab:hover { color:var(--text); }
.backup-tab.active { color:var(--text); border-bottom-color:var(--gold); }
.backup-body { flex:1; overflow:hidden; padding:16px 20px; display:flex; flex-direction:column; gap:10px; min-height:0; }
.backup-ta {
  width:100%; flex:1; min-height:0; height:0;
  background:var(--bg); font-family:var(--mono); font-size:16px; line-height:1.7;
  padding:14px; border:1px solid var(--border); border-radius:10px; resize:none; outline:none;
}
.backup-ta.export-mode { color:#a78bfa; }
.backup-ta.import-mode { color:var(--text); border-color:rgba(245,166,35,0.4); }
.backup-hint { font-size:11px; color:var(--text2); flex-shrink:0; }
.backup-warning {
  font-size:11px; color:var(--gold); background:rgba(245,166,35,0.08);
  border:1px solid rgba(245,166,35,0.25); border-radius:8px; padding:10px 12px;
  flex-shrink:0; display:none;
}
.backup-warning.show { display:block; }
.backup-ft { padding:14px 20px; border-top:1px solid var(--border); flex-shrink:0; display:flex; gap:8px; }
.backup-btn {
  flex:1; padding:13px; border-radius:12px; border:none;
  font-size:14px; font-weight:700; cursor:pointer; transition:all .15s;
}
.backup-btn.primary { background:var(--gold); color:#000; }
.backup-btn.primary:hover { background:#e09b1a; }
.backup-btn.primary.ok { background:var(--green); color:#fff; }
.backup-btn.secondary { background:var(--surface2); color:var(--text2); border:1px solid var(--border); flex:0 0 auto; padding:13px 20px; }
.backup-btn.secondary:hover { color:var(--text); border-color:var(--border2); }
.backup-btn.danger { background:rgba(255,59,47,0.15); color:var(--red); border:1px solid rgba(255,59,47,0.3); }
.backup-btn.danger:hover { background:rgba(255,59,47,0.25); }

/* ═══════════════════ RESPONSIVE ═══════════════════ */
@media(max-width:600px){
  .stats-strip{grid-template-columns:repeat(2,1fr);}
  .hdr-nav{display:none;}
  .tgrid{grid-template-columns:1fr;}
  .dup-stats{grid-template-columns:repeat(3,1fr);}
  .dup-stat-val{font-size:20px;}
}
@media(max-width:400px){
  .stats-strip{grid-template-columns:1fr 1fr;}
  .stat-val{font-size:24px;}
}

<!-- HEADER -->
<header class="hdr">

</header>

<!-- TAB BAR -->

</div>

/* ─── STATE ─────────────────────────────────────────────── */
let owned={}, dups={}, filterMode='all', activeTab='album', dupFilterOnlyHas=false;

function load(){try{const r=localStorage.getItem('panini2026v2');if(r)owned=JSON.parse(r);}catch(e){}}
function save(){localStorage.setItem('panini2026v2',JSON.stringify(owned));}
function loadDups(){try{const r=localStorage.getItem('panini2026dups');if(r)dups=JSON.parse(r);}catch(e){}}
function saveDups(){localStorage.setItem('panini2026dups',JSON.stringify(dups));}
function has(k){return !!owned[k];}
function key(c,n){return c+'_'+n;}
function getDup(k){return dups[k]||0;}

/* ─── STICKER TOGGLE ────────────────────────────────────── */
function animStk(el, wasGot){
  el.classList.remove('pop-in','pop-out');
  void el.offsetWidth;
  el.classList.add(wasGot?'pop-out':'pop-in');
  el.addEventListener('animationend',()=>el.classList.remove('pop-in','pop-out'),{once:true});
  const rip=document.createElement('span');
  rip.className='stk-rip';
  el.appendChild(rip);
  rip.addEventListener('animationend',()=>rip.remove(),{once:true});
}

function toggle(k,el){
  const was=has(k);
  owned[k]=!owned[k];if(!owned[k])delete owned[k];
  save();
  if(el){
    animStk(el,was);
    el.classList.toggle('got',!was);
    updateCardCount(el);
  }
  updateStats();
}
function toggleS(id,el){
  const was=has(id);
  owned[id]=!owned[id];if(!owned[id])delete owned[id];
  save();
  if(el){
    animStk(el,was);
    el.classList.toggle('got',!was);
    const oc=FWC.filter(s=>has(s.id)).length;
    const b=document.getElementById('introBadge');
    if(b)b.textContent=oc+'/20 stickers';
  }
  updateStats();
}
function updateCardCount(el){
  const card=el.closest('.tcard');if(!card)return;
  const code=card.id.replace('tc_','');
  const oc=Array.from({length:20},(_,i)=>has(key(code,i+1))).filter(Boolean).length;
  const cb=card.querySelector('.tcnt b');if(cb)cb.textContent=oc;
  const bf=card.querySelector('.tbar-f');if(bf)bf.style.width=Math.round(oc/20*100)+'%';
  card.classList.toggle('done',oc===20);
}
function markAll(c,v){
  for(let i=1;i<=20;i++){const k=key(c,i);if(v)owned[k]=true;else delete owned[k];}
  save();render();
}
function toggleCoke(id,el){
  const was=has(id);
  owned[id]=!owned[id];if(!owned[id])delete owned[id];
  save();
  if(el){
    el.classList.toggle('got',!was);
    el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
    el.addEventListener('animationend',()=>el.classList.remove('pop'),{once:true});
    const rip=document.createElement('span');rip.className='crip';
    el.appendChild(rip);rip.addEventListener('animationend',()=>rip.remove(),{once:true});
    const oc2=COKE.filter(s=>has(s.id)).length;
    const t=document.getElementById('cokeTally');if(t)t.textContent=oc2+'/14 colectados';
    const b=document.getElementById('cokeBar');if(b)b.style.width=Math.round(oc2/14*100)+'%';
  }
  updateStats();
}

/* ─── RENDER ─────────────────────────────────────────────── */
function stkHtml(k,foil,lbl,num){
  return '<div class="stk'+(foil?' foil':'')+(has(k)?' got':'')+'" data-tip="'+lbl+'" onclick="toggle(\''+k+'\',this)">'+num+'</div>';
}
function dstkHtml(id,foil,lbl,num){
  return '<div class="dstk'+(foil?' foil':'')+(has(id)?' got':'')+'" data-tip="'+lbl+'" onclick="toggleS(\''+id+'\',this)">'+num+'</div>';
}

function introHtml(){
  const oc=FWC.filter(s=>has(s.id)).length;
  return '<div class="intro-card">'
    +'<div class="intro-hd"><span class="intro-title">Introducción · FWC00–FWC19</span>'
    +'<span class="intro-badge" id="introBadge">'+oc+'/20 stickers</span></div>'
    +'<div class="intro-body">'
    +'<div><div class="intro-sub">Presentación · Emblemas · Estadios · Campeones</div>'
    +'<div class="intro-row">'+FWC.map(s=>dstkHtml(s.id,!!s.foil,s.label,s.num)).join('')+'</div></div>'
    +'</div></div>';
}

function cokeHtml(){
  const oc=COKE.filter(s=>has(s.id)).length;
  const pct=Math.round(oc/14*100);
  return '<div class="coke-card">'
    +'<div class="coke-hd"><div class="coke-brand"><div class="coke-icon">🥤</div>'
    +'<div><div class="coke-title">Coca-Cola × Panini</div>'
    +'<div class="coke-sub">Exclusivos · Solo en botellas promocionales</div></div></div>'
    +'<span class="coke-tally" id="cokeTally">'+oc+'/14 colectados</span></div>'
    +'<div class="coke-pbar"><div class="coke-pbar-f" id="cokeBar" style="width:'+pct+'%"></div></div>'
    +'<div class="coke-body">'+COKE.map(s=>'<div class="cstk'+(has(s.id)?' got':'')+'" onclick="toggleCoke(\''+s.id+'\',this)">'
      +'<span class="cstk-num">'+s.num+'</span>'
      +'<span class="cstk-flag">'+s.flag+'</span>'
      +'<div class="cstk-info"><div class="cstk-name">'+s.name+'</div><div class="cstk-country">'+s.country+'</div></div>'
    +'</div>').join('')+'</div>'
    +'<div class="coke-note">⚠️ Estos 14 stickers no están en sobres regulares — solo en botellas Coca-Cola edición especial.</div>'
    +'</div>';
}

function teamCardHtml(t,gl){
  const search=(document.getElementById('searchInput').value||'').toLowerCase();
  if(search&&!t.n.toLowerCase().includes(search)&&!t.c.toLowerCase().includes(search))return'';
  let oc=0,stks='';
  for(let i=1;i<=20;i++){
    const k=key(t.c,i);const foil=i===1||i===13;
    const lbl=i===1?t.c+'1 ★':i===13?t.c+'13':t.c+i;
    if(has(k))oc++;
    stks+=stkHtml(k,foil,lbl,i);
  }
  if(filterMode==='complete'&&oc<20)return'';
  if(filterMode==='missing'&&oc>=20)return'';
  const pct=Math.round(oc/20*100),done=oc===20;
  return '<div class="tcard'+(done?' done':'')+'" id="tc_'+t.c+'">'
    +'<div class="thead"><span class="tflag">'+t.f+'</span>'
    +'<div class="tinfo"><div class="tname">'+t.n+'</div><div class="tcode">'+t.c+' · GRP '+gl+'</div></div>'
    +'<div class="tcnt"><b>'+oc+'</b>/20</div></div>'
    +'<div class="tstks">'+stks+'</div>'
    +'<div class="tbar"><div class="tbar-f" style="width:'+pct+'%"></div></div>'
    +'<div class="tfoot">'
    +'<button class="tfbtn" onclick="markAll(\''+t.c+'\',true)">✓ Pegar todas</button>'
    +'<button class="tfbtn clr" onclick="markAll(\''+t.c+'\',false)">✕ Limpiar</button>'
    +'</div></div>';
}

function render(){
  let html=introHtml();
  let any=false;
  for(const g of GROUPS){
    let cards='',go=0,gt=g.teams.length*20;
    for(const t of g.teams){
      const c=Array.from({length:20},(_,i)=>has(key(t.c,i+1))).filter(Boolean).length;
      go+=c;
      const h=teamCardHtml(t,g.l);
      if(h){cards+=h;any=true;}
    }
    if(!cards)continue;
    const gpct=Math.round(go/gt*100);
    html+='<div class="grp-hd"><span class="grp-letter">Grupo '+g.l+'</span>'
      +'<span class="grp-name"></span>'
      +'<div class="grp-bar-out"><div class="grp-bar-in" style="width:'+gpct+'%"></div></div>'
      +'<span class="grp-tally">'+go+'/'+gt+'</span></div>'
      +'<div class="tgrid">'+cards+'</div>';
  }
  if(!any)html+='<div style="text-align:center;padding:60px 20px;color:var(--text2);font-size:14px;">No hay equipos que coincidan</div>';
  html+=cokeHtml();
  document.getElementById('mainContent').innerHTML=html;
  updateStats();
}

function updateStats(){
  const io=FWC.filter(s=>has(s.id)).length;
  const co=COKE.filter(s=>has(s.id)).length;
  let to=0,comp=0;
  for(const g of GROUPS)for(const t of g.teams){
    const c=Array.from({length:20},(_,i)=>has(key(t.c,i+1))).filter(Boolean).length;
    to+=c;if(c===20)comp++;
  }
  const total=io+co+to,TOTAL=994,pct=Math.round(total/TOTAL*100);
  const circ=2*Math.PI*18;
  document.getElementById('arcFill').style.strokeDashoffset=circ*(1-pct/100);
  document.getElementById('arcPct').textContent=pct+'%';
  document.getElementById('arcCount').textContent=total+' / '+TOTAL;
  document.getElementById('sOwned').textContent=total;
  document.getElementById('sMissing').textContent=TOTAL-total;
  document.getElementById('sTeams').innerHTML=comp+'<span style="font-size:16px;font-weight:400;color:var(--text2)"> /48</span>';
  document.getElementById('sTotalAlbum').textContent=TOTAL;
}

/* ─── CONTROLS ──────────────────────────────────────────── */
function setFilter(mode){
  filterMode=mode;
  ['All','Missing','Complete'].forEach(m=>{
    const match=mode===m.toLowerCase();
    ['btn'+m,'mbtn'+m].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.toggle('active',match);});
  });
  render();
}
function switchTab(tab){
  activeTab=tab;
  document.getElementById('panelAlbum').style.display=tab==='album'?'block':'none';
  document.getElementById('panelDups').style.display=tab==='dups'?'block':'none';
  document.getElementById('tabAlbum').classList.toggle('active',tab==='album');
  document.getElementById('tabDups').classList.toggle('active',tab==='dups');
  if(tab==='dups')renderDups();
}
function confirmReset(){
  if(confirm('¿Reiniciar todo el progreso?\nEsta acción no se puede deshacer.')){owned={};save();render();}
}

/* ─── DUPLICATES ────────────────────────────────────────── */
function toggleDupFilter(){
  dupFilterOnlyHas=!dupFilterOnlyHas;
  document.getElementById('dupOnlyHas').classList.toggle('on',dupFilterOnlyHas);
  renderDups();
}
function changeDup(k,delta){
  const cur=getDup(k),next=Math.max(0,cur+delta);
  if(next===0)delete dups[k];else dups[k]=next;
  saveDups();
  const ce=document.getElementById('dc_'+k);
  if(ce){ce.textContent=next;ce.className='dcount'+(next===0?' zero':'');}
  const se=ce&&ce.closest('.dup-stk');
  if(se)se.classList.toggle('has',next>0);
  // update team badge
  const te=ce&&ce.closest('.dup-team');
  if(te){
    const code=te.id.replace('dteam_','');
    const tot=Array.from({length:20},(_,i)=>getDup(key(code,i+1))).reduce((a,b)=>a+b,0);
    const badge=te.querySelector('.dup-badge');
    if(badge){badge.textContent=tot>0?'+'+tot+' rep.':'0';badge.classList.toggle('has',tot>0);}
  }
  updateDupBadge();updateDupStats();
}
function updateDupBadge(){
  const t=Object.values(dups).reduce((a,b)=>a+b,0);
  document.getElementById('dupBadge').textContent=t;
}
function updateDupStats(){
  const vals=Object.values(dups);
  const total=vals.reduce((a,b)=>a+b,0),distinct=vals.filter(v=>v>0).length;
  document.getElementById('dTotalDups').textContent=total;
  document.getElementById('dDistinct').textContent=distinct;
  document.getElementById('dForTrade').textContent=total;
}
function dupStkHtml(k,num,foil,lbl){
  const cnt=getDup(k),hasD=cnt>0;
  return '<div class="dup-stk'+(foil?' foil':'')+(hasD?' has':'')+'" title="'+lbl+'">'
    +'<span class="dup-stk-num">'+num+'</span>'
    +'<button class="dbtn minus" onclick="changeDup(\''+k+'\',-1)">−</button>'
    +'<span class="dcount'+(cnt===0?' zero':'')+'" id="dc_'+k+'">'+cnt+'</span>'
    +'<button class="dbtn plus" onclick="changeDup(\''+k+'\',+1)">+</button>'
    +'</div>';
}
function toggleDupTeam(code){
  const el=document.getElementById('dteam_'+code);if(el)el.classList.toggle('open');
}
function renderDups(){
  const search=(document.getElementById('dupSearch').value||'').toLowerCase();
  let html='';
  // FWC
  const fwcHas=FWC.some(s=>getDup(s.id)>0);
  if(!dupFilterOnlyHas||fwcHas){
    if(!search||'fwc introduccion'.includes(search)){
      html+='<div class="dup-group"><div class="dup-group-title">Introducción · FWC00–FWC19</div>'
        +'<div class="dup-team open" id="dteam_FWC"><div class="dup-stickers" style="display:flex">'
        +FWC.map(s=>dupStkHtml(s.id,s.num,!!s.foil,s.label)).join('')
        +'</div></div></div>';
    }
  }
  for(const g of GROUPS){
    let grpH='';
    for(const t of g.teams){
      if(search&&!t.n.toLowerCase().includes(search)&&!t.c.toLowerCase().includes(search))continue;
      const tot=Array.from({length:20},(_,i)=>getDup(key(t.c,i+1))).reduce((a,b)=>a+b,0);
      if(dupFilterOnlyHas&&tot===0)continue;
      const stks=Array.from({length:20},(_,i)=>{
        const idx=i+1,k=key(t.c,idx),foil=idx===1||idx===13;
        return dupStkHtml(k,idx,foil,t.c+idx);
      }).join('');
      grpH+='<div class="dup-team" id="dteam_'+t.c+'">'
        +'<div class="dup-team-hd" onclick="toggleDupTeam(\''+t.c+'\')">'
        +'<span class="dup-team-flag">'+t.f+'</span>'
        +'<span class="dup-team-name">'+t.n+'</span>'
        +'<span class="dup-badge'+(tot>0?' has':'')+'">'+( tot>0?'+'+tot+' rep.':'0')+'</span>'
        +'<span class="dup-chev">▾</span></div>'
        +'<div class="dup-stickers">'+stks+'</div></div>';
    }
    if(!grpH)continue;
    html+='<div class="dup-group"><div class="dup-group-title">Grupo '+g.l+'</div>'+grpH+'</div>';
  }
  // Coke
  const cokeHas=COKE.some(s=>getDup(s.id)>0);
  if(!dupFilterOnlyHas||cokeHas){
    if(!search||'coca-cola cc'.includes(search)){
      html+='<div class="dup-group"><div class="dup-group-title">🥤 Coca-Cola Exclusivos</div>'
        +'<div class="dup-team open" id="dteam_CC"><div class="dup-stickers" style="display:flex">'
        +COKE.map(s=>dupStkHtml(s.id,s.num,false,s.name)).join('')
        +'</div></div></div>';
    }
  }
  if(!html)html='<div class="dup-empty">No hay stickers que coincidan</div>';
  document.getElementById('dupContent').innerHTML=html;
  updateDupStats();
}

/* ─── EXPORT ─────────────────────────────────────────────── */
let exportTab='missing';
function openExport(){
  exportTab='missing';
  document.getElementById('etabMissing').classList.add('active');
  document.getElementById('etabDups').classList.remove('active');
  buildExportText();
  document.getElementById('exportModal').classList.add('open');
}
function closeExport(){document.getElementById('exportModal').classList.remove('open');}
function handleOverlayClick(e){if(e.target===document.getElementById('exportModal'))closeExport();}
function switchExportTab(tab){
  exportTab=tab;
  document.getElementById('etabMissing').classList.toggle('active',tab==='missing');
  document.getElementById('etabDups').classList.toggle('active',tab==='dups');
  buildExportText();
  const btn=document.getElementById('copyBtn');
  btn.textContent='📋 Copiar al portapapeles';btn.classList.remove('ok');
}
function buildExportText(){
  const ta=document.getElementById('exportTextarea');
  const hint=document.getElementById('exportHint');
  const lines=[];
  const date=new Date().toLocaleDateString('es-CR',{day:'2-digit',month:'2-digit',year:'numeric'});
  if(exportTab==='missing'){
    ta.style.color='var(--green)';
    lines.push('PANINI FIFA WORLD CUP 2026™ — ME FALTAN');
    lines.push('Generado: '+date);lines.push('');
    const fm=FWC.filter(s=>!has(s.id));
    if(fm.length){lines.push('── INTRODUCCIÓN');fm.forEach(s=>lines.push('  '+s.id));lines.push('');}
    for(const g of GROUPS){
      const gl=[];
      for(const t of g.teams){
        const ms=[];
        for(let i=1;i<=20;i++){if(!has(key(t.c,i)))ms.push(t.c+i);}
        if(ms.length){gl.push('  '+t.f+' '+t.n+' ('+ms.length+')');ms.forEach(m=>gl.push('    '+m));}
      }
      if(gl.length){lines.push('── GRUPO '+g.l);gl.forEach(l=>lines.push(l));lines.push('');}
    }
    const cm=COKE.filter(s=>!has(s.id));
    if(cm.length){lines.push('── COCA-COLA');cm.forEach(s=>lines.push('  '+s.num));lines.push('');}
    const tot=FWC.filter(s=>!has(s.id)).length
      +GROUPS.flatMap(g=>g.teams).reduce((n,t)=>n+Array.from({length:20},(_,i)=>!has(key(t.c,i+1))).filter(Boolean).length,0)
      +COKE.filter(s=>!has(s.id)).length;
    lines.push('TOTAL: '+tot+' de 994');
    ta.value=lines.join("\n");
    hint.textContent=tot+' stickers pendientes';
  } else {
    ta.style.color='var(--gold)';
    lines.push('PANINI FIFA WORLD CUP 2026™ — REPETIDAS');
    lines.push('Generado: '+date);lines.push('');
    const fd=FWC.filter(s=>getDup(s.id)>0);
    if(fd.length){lines.push('── INTRODUCCIÓN');fd.forEach(s=>lines.push('  '+s.id+' ×'+getDup(s.id)));lines.push('');}
    for(const g of GROUPS){
      const gl=[];
      for(const t of g.teams){
        const td=[];
        for(let i=1;i<=20;i++){const k=key(t.c,i);const cnt=getDup(k);if(cnt>0)td.push(t.c+i+' ×'+cnt);}
        if(td.length){gl.push('  '+t.f+' '+t.n);td.forEach(d=>gl.push('    '+d));}
      }
      if(gl.length){lines.push('── GRUPO '+g.l);gl.forEach(l=>lines.push(l));lines.push('');}
    }
    const cd=COKE.filter(s=>getDup(s.id)>0);
    if(cd.length){lines.push('── COCA-COLA');cd.forEach(s=>lines.push('  '+s.num+' ×'+getDup(s.id)));lines.push('');}
    const tot=Object.values(dups).reduce((a,b)=>a+b,0),dist=Object.keys(dups).length;
    lines.push(tot===0?'(Sin repetidas registradas)':'TOTAL: '+tot+' repetidas ('+dist+' distintas)');
    ta.value=lines.join("\n");
    hint.textContent=tot>0?tot+' repetidas · '+dist+' distintas':'Registra tus repetidas en el tab Repetidas';
  }
}
function copyExport(){
  const ta=document.getElementById('exportTextarea');
  ta.select();ta.setSelectionRange(0,99999);
  try{navigator.clipboard.writeText(ta.value).catch(()=>document.execCommand('copy'));}
  catch(e){document.execCommand('copy');}
  const btn=document.getElementById('copyBtn');
  btn.textContent='✓ Copiado';btn.classList.add('ok');
  setTimeout(()=>{btn.textContent='📋 Copiar al portapapeles';btn.classList.remove('ok');},2500);
}

/* ─── STICKER LOOKUP ─────────────────────────────────────── */
// Build a flat lookup map: normalised-code → {id, label, foil, teamCode}
function buildLookupMap() {
  const map = {};
  // FWC stickers
  FWC.forEach(s => {
    map[s.id.toLowerCase()] = {id: s.id, label: s.label, foil: !!s.foil, type:'fwc'};
    map['fwc'+s.num] = {id: s.id, label: s.label, foil: !!s.foil, type:'fwc'};
  });
  // Team stickers
  for (const g of GROUPS) {
    for (const t of g.teams) {
      for (let i = 1; i <= 20; i++) {
        const k = key(t.c, i);
        const lbl = i===1 ? t.n+' - Logo' : i===13 ? t.n+' - Foto' : t.n+' - Jugador '+i;
        const entry = {id: k, label: lbl, foil: i===1||i===13, type:'team', teamCode: t.c, teamName: t.n, flag: t.f, num: i};
        map[(t.c+i).toLowerCase()] = entry;
        map[k.toLowerCase()] = entry; // MEX_1
      }
    }
  }
  // Coca-Cola
  COKE.forEach(s => {
    const entry = {id: s.id, label: s.name+' ('+s.country+')', foil: false, type:'coke', flag: s.flag};
    map[s.id.toLowerCase()] = entry;
    map[s.num.toLowerCase()] = entry;      // cc-1
    map[s.num.replace('-','').toLowerCase()] = entry; // cc1
  });
  return map;
}

let lookupMap = {};
let lookupCurrentId = null;

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('visible');
  document.getElementById('lookupResult').style.display = 'none';
  lookupCurrentId = null;
  render();
}

function handleSearch() {
  const raw = (document.getElementById('searchInput').value || '').trim();
  // Show/hide clear button
  document.getElementById('searchClear').classList.toggle('visible', raw.length > 0);
  const q = raw.toLowerCase().replace(/\s/g,'');
  const resultEl = document.getElementById('lookupResult');

  // Try to find exact sticker code match
  const entry = lookupMap[q];

  if (q.length >= 2 && entry) {
    // Show lookup result
    resultEl.style.display = 'block';
    const pill = document.getElementById('lookupPill');
    const got = has(entry.id);
    pill.className = 'lookup-pill ' + (got ? 'found' : 'missing');

    const prefix = entry.flag ? entry.flag+' ' : '';
    document.getElementById('lookupCode').textContent = raw.toUpperCase();
    document.getElementById('lookupLabel').textContent = '';
    document.getElementById('lookupStatus').textContent = got ? '✓ Pegado' : '✗ Falta';
    document.getElementById('lookupToggle').textContent = got ? 'Quitar' : 'Pegar';
    lookupCurrentId = entry.id;
    refreshLookupDup();
  } else {
    resultEl.style.display = 'none';
    lookupCurrentId = null;
  }

  // Also run normal country filter
  render();
}

function lookupDoToggle() {
  if (!lookupCurrentId) return;
  owned[lookupCurrentId] = !owned[lookupCurrentId];
  if (!owned[lookupCurrentId]) delete owned[lookupCurrentId];
  save();
  // Refresh lookup pill
  const got = has(lookupCurrentId);
  const pill = document.getElementById('lookupPill');
  pill.className = 'lookup-pill ' + (got ? 'found' : 'missing');
  document.getElementById('lookupStatus').textContent = got ? '✓ Pegado' : '✗ Falta';
  document.getElementById('lookupToggle').textContent = got ? 'Quitar' : 'Pegar';
  // Refresh card if visible
  const cardEl = document.getElementById('tc_'+(lookupCurrentId.split('_')[0]));
  if (cardEl) {
    const stkEls = cardEl.querySelectorAll('.stk');
    stkEls.forEach(el => {
      if (el.getAttribute('onclick') && el.getAttribute('onclick').includes("'"+lookupCurrentId+"'")) {
        el.classList.toggle('got', got);
      }
    });
    updateCardCount(cardEl.querySelector('.stk'));
  }
  refreshLookupDup();
  updateStats();
}

function refreshLookupDup() {
  if (!lookupCurrentId) return;
  const cnt = getDup(lookupCurrentId);
  const el = document.getElementById('lookupDupCount');
  if (el) {
    el.textContent = cnt;
    el.className = 'lookup-dup-count' + (cnt === 0 ? ' zero' : '');
  }
}

function lookupChangeDup(delta) {
  if (!lookupCurrentId) return;
  const cur = getDup(lookupCurrentId);
  const next = Math.max(0, cur + delta);
  if (next === 0) delete dups[lookupCurrentId]; else dups[lookupCurrentId] = next;
  saveDups();
  refreshLookupDup();
  updateDupBadge();
  updateDupStats();
  // update dup panel if open
  const dc = document.getElementById('dc_'+lookupCurrentId);
  if (dc) {
    dc.textContent = next;
    dc.className = 'dcount' + (next === 0 ? ' zero' : '');
    const stkEl = dc.closest('.dup-stk');
    if (stkEl) stkEl.classList.toggle('has', next > 0);
  }
}

/* ─── BACKUP ─────────────────────────────────────────────── */
let backupTab = 'export';

function handleDupSearch() {
  const val = document.getElementById('dupSearch').value || '';
  document.getElementById('dupClear').classList.toggle('visible', val.length > 0);
  renderDups();
}
function clearDupSearch() {
  document.getElementById('dupSearch').value = '';
  document.getElementById('dupClear').classList.remove('visible');
  renderDups();
}
function backupSelectAll() {
  const ta = document.getElementById('backupTa');
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, 99999);
}

function openBackup() {
  backupTab = 'export';
  document.getElementById('btabExport').classList.add('active');
  document.getElementById('btabImport').classList.remove('active');
  buildBackupExport();
  document.getElementById('backupModal').classList.add('open');
}
function closeBackup() { document.getElementById('backupModal').classList.remove('open'); }
function handleBackupOverlay(e) { if(e.target===document.getElementById('backupModal')) closeBackup(); }

function switchBackupTab(tab) {
  backupTab = tab;
  document.getElementById('btabExport').classList.toggle('active', tab==='export');
  document.getElementById('btabImport').classList.toggle('active', tab==='import');
  const ta = document.getElementById('backupTa');
  const warn = document.getElementById('backupWarning');
  const hint = document.getElementById('backupHint');
  const btn  = document.getElementById('backupActionBtn');
  if (tab === 'export') {
    ta.readOnly = true;
    ta.className = 'backup-ta export-mode';
    warn.classList.remove('show');
    btn.textContent = '📋 Copiar';
    btn.className = 'backup-btn primary';
    buildBackupExport();
  } else {
    ta.readOnly = false;
    ta.value = '';
    ta.className = 'backup-ta import-mode';
    ta.placeholder = 'Pega aquí tu backup JSON...';
    warn.classList.add('show');
    hint.textContent = 'Pega el JSON de un backup exportado anteriormente.';
    btn.textContent = '📥 Importar datos';
    btn.className = 'backup-btn danger';
    btn.classList.remove('ok');
  }
}

function buildBackupExport() {
  const data = {
    version: 1,
    date: new Date().toISOString(),
    album: owned,
    duplicates: dups
  };
  const json = JSON.stringify(data, null, 2);
  document.getElementById('backupTa').value = json;
  const totalOwned = Object.keys(owned).length;
  const totalDups  = Object.values(dups).reduce((a,b)=>a+b,0);
  document.getElementById('backupHint').textContent =
    totalOwned + ' stickers pegados · ' + totalDups + ' repetidas · ' + json.length + ' caracteres';
}

function backupAction() {
  if (backupTab === 'export') {
    const ta = document.getElementById('backupTa');
    ta.select(); ta.setSelectionRange(0, 99999);
    try { navigator.clipboard.writeText(ta.value).catch(()=>document.execCommand('copy')); }
    catch(e) { document.execCommand('copy'); }
    const btn = document.getElementById('backupActionBtn');
    btn.textContent = '✓ Copiado';
    btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent='📋 Copiar'; btn.classList.remove('ok'); }, 2500);
  } else {
    // Import
    const raw = document.getElementById('backupTa').value.trim();
    if (!raw) { alert('Pega un JSON de backup primero.'); return; }
    try {
      const data = JSON.parse(raw);
      if (typeof data.album !== 'object') throw new Error('Formato inválido');
      owned = data.album || {};
      dups  = data.duplicates || {};
      save(); saveDups();
      render(); updateDupBadge(); updateDupStats();
      closeBackup();
      // brief success feedback
      const btn = document.getElementById('backupActionBtn');
      btn.textContent = '✓ Importado';
      setTimeout(()=>{ btn.textContent='📥 Importar datos'; }, 2000);
    } catch(e) {
      alert('JSON inválido. Asegúrate de pegar un backup completo exportado desde esta app.');
    }
  }
}

/* ─── INIT ───────────────────────────────────────────────── */
load(); loadDups(); lookupMap = buildLookupMap(); render(); updateDupBadge();
</script>
